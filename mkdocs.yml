site_name: GitHub Copilot Train-the-Trainer
site_description: Teach GitHub Copilot and GitHub Agentic Workflows with trainer guides and hands-on labs for 29 sessions across 7 modules.
site_author: GitHub Copilot TTT
extra:
  source_repository_url: https://github.com/microsoft/frontier-ghcp-ttt-rvas
docs_dir: .
site_dir: site

exclude_docs: |
  .git/
  .github/
  .devcontainer/
  .copilot/
  .agents/
  .claude/
  .codex/
  .impeccable/
  .vscode/
  node_modules/
  site/
  hooks/
  tests/
  scripts/
  themes/
  data/
  track-template/
  sessions/session-*/lab/starter/
  sessions/session-*/lab/solution/
  PRODUCT.md
  DESIGN.md
  AGENTS.md
  TONE-OF-VOICE.md
  skills-lock.json
  requirements.txt
  overrides/main.html
  overrides/partials/
  overrides/set-builder.html
  overrides/session-set.html
  **/__pycache__/
  .gitignore
  .gitattributes
  .markdownlint.json
  .markdownlintignore
  .squad-workstream

theme:
  name: material
  custom_dir: overrides
  logo: assets/logos/rvap-full.png
  favicon: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.pruning
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

extra_css:
  - overrides/rvap-brand.css
  - overrides/extra.css
  - overrides/set-builder.css

extra_javascript:
  - overrides/session.js
  - overrides/sets.js

plugins:
  - same-dir
  - search

hooks:
  - hooks/github_alerts.py
  - hooks/file_links.py
  - hooks/presentation_embed.py

validation:
  links:
    unrecognized_links: ignore

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: README.md
  - Build your set: build-set.md
  - Curriculum: curriculum-plan.md
  - Glossary: sessions/glossary.md
