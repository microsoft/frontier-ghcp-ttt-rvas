name: Build & Deploy Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Validate lab starter and solution code
  # ─────────────────────────────────────────────────────────────────────────────
  validate-labs:
    name: Validate Lab Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'

      - name: Install Bicep CLI
        run: az bicep install --version v0.46.1

      - name: Install Python lab dependencies
        run: python -m pip install -r sessions/session-m2-06-python-repair-refactor/lab/solution/requirements-dev.txt

      - name: Validate lab files
        run: bash scripts/validate-labs.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Render Marp presentations → output/html/*.html + output/pdf/*.pdf
  # ─────────────────────────────────────────────────────────────────────────────
  render-presentations:
    name: Render Presentations (Marp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Install Chromium for Marp PDF export
        run: npx puppeteer browsers install chrome

      - name: Build all presentations
        run: bash scripts/build-slides.sh

      - name: Upload presentation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: presentations
          path: |
            output/html/
            output/pdf/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build MkDocs site (runs on PRs and pushes; no environment gate)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    needs: [validate-labs, render-presentations]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      - name: Download presentation artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: presentations
          path: output/

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload pull request site
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pull-request-site
          path: site/
          retention-days: 7

      - name: Read saved previews
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add --detach preview-state FETCH_HEAD
          else
            mkdir -p preview-state
          fi

      - name: Add saved previews
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -d preview-state/previews ]; then
            mkdir -p site/previews
            cp -a preview-state/previews/. site/previews/
          fi

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Deploy MkDocs site to GitHub Pages (main pushes only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: Publish a persistent preview for pull requests from this repository
  # ─────────────────────────────────────────────────────────────────────────────
  build-preview:
    name: Build Pull Request Preview
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    outputs:
      preview_path: ${{ steps.preview_path.outputs.value }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install site dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @marp-team/marp-cli
          npx puppeteer browsers install chrome

      - name: Build production presentations
        run: bash scripts/build-slides.sh

      - name: Build production site
        run: mkdocs build --strict

      - name: Download pull request site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pull-request-site
          path: pull-request-site

      - name: Set preview path
        id: preview_path
        env:
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          suffix="$(printf '%s' "${PREVIEW_NAME}" | sha256sum | cut -c1-10)"
          echo "value=previews/${PREVIEW_NAME}-${suffix}" >> "${GITHUB_OUTPUT}"

      - name: Read preview state
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add --detach preview-state FETCH_HEAD
          else
            git worktree add --orphan preview-state
            touch preview-state/.nojekyll
          fi

      - name: Save pull request preview
        env:
          PREVIEW_PATH: ${{ steps.preview_path.outputs.value }}
        run: |
          touch preview-state/.nojekyll
          rm -rf "preview-state/${PREVIEW_PATH}"
          mkdir -p "preview-state/${PREVIEW_PATH}"
          cp -a pull-request-site/. "preview-state/${PREVIEW_PATH}/"

          git -C preview-state config user.name "github-actions[bot]"
          git -C preview-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C preview-state add -- .nojekyll "${PREVIEW_PATH}"
          if ! git -C preview-state diff --cached --quiet; then
            git -C preview-state commit -m "Update preview for ${PREVIEW_PATH}"
            git -C preview-state push origin HEAD:gh-pages
          fi

      - name: Add saved previews
        run: |
          if [ -d preview-state/previews ]; then
            mkdir -p site/previews
            cp -a preview-state/previews/. site/previews/
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 7: Deploy the pull request preview and add its URL to the pull request
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Pull Request Preview
    runs-on: ubuntu-latest
    needs: [build-preview]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}${{ needs.build-preview.outputs.preview_path }}/"
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Add preview URL to workflow summary
        run: |
          echo "Preview: ${{ steps.deployment.outputs.page_url }}${{ needs.build-preview.outputs.preview_path }}/" >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PATH: ${{ needs.build-preview.outputs.preview_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          MARKER="<!-- pages-preview-url -->"
          PREVIEW_URL="${SITE_URL}${PREVIEW_PATH}/"
          BODY="${MARKER}
          Preview: ${PREVIEW_URL}

          Updated for commit ${GITHUB_SHA}."
          COMMENT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\"))) | .id" | tail -n 1)"

          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="${BODY}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${BODY}"
          fi
