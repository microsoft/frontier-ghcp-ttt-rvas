# FIXED VERSION — all 4 issues resolved

name: CI Pipeline

# FIX 3: Added permissions block (least-privilege)
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # FIX 2: Updated from actions/checkout@v2 to actions/checkout@v4
      - uses: actions/checkout@v4

      # FIX 1: Fixed YAML indentation — steps must be at the same level
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FIX 4: Changed `npm install` to `npm ci` for reproducible CI builds
      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test
