# FIX: Complete, working CI workflow
name: CI Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # FIX: Updated from v2 to v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # FIX: Added npm caching

      - name: Install dependencies
        run: npm ci  # FIX: Use npm ci instead of npm install for CI

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: dist/
          retention-days: 7
