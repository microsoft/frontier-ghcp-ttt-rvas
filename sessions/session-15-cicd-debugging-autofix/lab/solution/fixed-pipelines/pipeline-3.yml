# FIXED: Matrix excludes EOL Node 16, handles cross-platform paths, sets CI env var
# Root causes:
# 1. Node 16 is EOL — modern APIs (structuredClone, Object.hasOwn) not available
# 2. Windows uses backslash paths, breaking test assertions
# 3. CI=true env var missing on some legs, causing inconsistent warning behavior

name: CI Matrix
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20]  # FIX 1: Removed Node 16 (EOL, missing modern APIs)
        # Node 16 reached EOL in September 2023. Code using structuredClone()
        # and Object.hasOwn() requires Node 18+.

    env:
      CI: true  # FIX 3: Set CI=true for ALL matrix legs consistently

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # FIX 2: Set a flag to normalize paths in tests across platforms
          FORCE_POSIX_PATHS: true

      - name: Build
        run: npm run build

# Note on FIX 2: The ideal fix is in the test code itself — use
# path.posix.join() or normalize paths before assertion. The env var
# approach is a workflow-level workaround. In production, fix the tests:
#
#   // Before (breaks on Windows):
#   expect(result.path).toBe('uploads/images/photo.jpg');
#
#   // After (cross-platform):
#   expect(result.path).toBe(path.join('uploads', 'images', 'photo.jpg'));
