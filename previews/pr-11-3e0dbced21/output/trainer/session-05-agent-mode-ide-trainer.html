<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Trainer guide moved</title>
</head>
<body>
  <p>This guide now uses the training site's shared layout.</p>
  <p><a id="trainer-guide" href="../../sessions/session-05-agent-mode-ide/trainer-content/index.html">Open trainer guide</a></p>
  <script>
    const link = document.getElementById("trainer-guide");
    const target = new URL(link.href);
    target.search = window.location.search;
    target.hash = window.location.hash;
    link.href = target.href;
    window.location.replace(target.href);
  </script>
</body>
</html>
